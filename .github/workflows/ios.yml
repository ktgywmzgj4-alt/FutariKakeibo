name: iOS build and tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        shell: bash
        run: |
          set -euo pipefail
          XCODE_PATH="$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' -print | sort -V | tail -n 1)"
          if [[ -z "$XCODE_PATH" ]]; then
            echo "Xcode 26 is not installed on this runner."
            exit 1
          fi
          sudo xcode-select --switch "$XCODE_PATH/Contents/Developer"
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version

      - name: Install XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
          xcodegen --version

      - name: Generate Xcode project
        shell: bash
        run: |
          set -euo pipefail
          xcodegen generate

      - name: Validate generated app metadata
        shell: bash
        run: |
          set -euo pipefail
          INFO_PLIST="FutariKakeibo/Resources/Info.plist"
          ENTITLEMENTS="FutariKakeibo/Resources/FutariKakeibo.entitlements"
          test -n "$(/usr/libexec/PlistBuddy -c 'Print :NSCameraUsageDescription' "$INFO_PLIST")"
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CKSharingSupported' "$INFO_PLIST")" == "true" ]]
          /usr/libexec/PlistBuddy -c 'Print :UILaunchScreen' "$INFO_PLIST" >/dev/null
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.developer.icloud-services:0' "$ENTITLEMENTS")" == "CloudKit" ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.developer.icloud-container-identifiers:0' "$ENTITLEMENTS")" == "iCloud.jp.aikawa.futarikakeibo" ]]

      - name: Inspect project and available simulators
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -list -project FutariKakeibo.xcodeproj
          xcrun simctl list runtimes available
          xcrun simctl list devices available

      - name: Select an available iPhone Simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          SIMULATOR_UDID="$(
            xcrun simctl list devices available --json |
            ruby -rjson -e '
              devices = JSON.parse(STDIN.read).fetch("devices")
              runtime = devices.keys.grep(/iOS/).sort.reverse.find do |key|
                devices.fetch(key).any? { |device| device["isAvailable"] && device["name"].start_with?("iPhone") }
              end
              abort "No available iPhone Simulator was found." unless runtime
              device = devices.fetch(runtime).find { |item| item["isAvailable"] && item["name"].start_with?("iPhone") }
              puts device.fetch("udid")
            '
          )"
          echo "udid=$SIMULATOR_UDID" >> "$GITHUB_OUTPUT"

      - name: Build and run unit tests
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project FutariKakeibo.xcodeproj \
            -scheme FutariKakeibo \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath DerivedData \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            test

  testflight:
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: macos-26
    timeout-minutes: 45
    env:
      TEAM_ID: 79XN3292J9
      BUNDLE_ID: jp.aikawa.futarikakeibo
      PROFILE_NAME: FutariKakeibo App Store

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        shell: bash
        run: |
          set -euo pipefail
          XCODE_PATH="$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' -print | sort -V | tail -n 1)"
          if [[ -z "$XCODE_PATH" ]]; then
            echo "Xcode 26 is not installed on this runner."
            exit 1
          fi
          sudo xcode-select --switch "$XCODE_PATH/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen and generate project
        shell: bash
        run: |
          set -euo pipefail
          HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
          xcodegen generate

      - name: Validate generated app metadata
        shell: bash
        run: |
          set -euo pipefail
          INFO_PLIST="FutariKakeibo/Resources/Info.plist"
          ENTITLEMENTS="FutariKakeibo/Resources/FutariKakeibo.entitlements"
          test -n "$(/usr/libexec/PlistBuddy -c 'Print :NSCameraUsageDescription' "$INFO_PLIST")"
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CKSharingSupported' "$INFO_PLIST")" == "true" ]]
          /usr/libexec/PlistBuddy -c 'Print :UILaunchScreen' "$INFO_PLIST" >/dev/null
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.developer.icloud-services:0' "$ENTITLEMENTS")" == "CloudKit" ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.developer.icloud-container-identifiers:0' "$ENTITLEMENTS")" == "iCloud.jp.aikawa.futarikakeibo" ]]

      - name: Import Apple Distribution certificate
        shell: bash
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          CERTIFICATE_PATH="$RUNNER_TEMP/distribution_certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"

          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Install App Store provisioning profile
        shell: bash
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          PROFILE_PATH="$RUNNER_TEMP/FutariKakeibo_App_Store.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"
          PROFILE_DIRECTORY="$HOME/Library/MobileDevice/Provisioning Profiles"

          printf '%s' "$PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PROFILE_PLIST")"
          mkdir -p "$PROFILE_DIRECTORY"
          cp "$PROFILE_PATH" "$PROFILE_DIRECTORY/$PROFILE_UUID.mobileprovision"
          printf '%s' "$PROFILE_UUID" > "$RUNNER_TEMP/profile_uuid"

      - name: Archive signed app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project FutariKakeibo.xcodeproj \
            -scheme FutariKakeibo \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/FutariKakeibo.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY='Apple Distribution' \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            OTHER_CODE_SIGN_FLAGS="--keychain $RUNNER_TEMP/app-signing.keychain-db"
      - name: Verify archived app metadata and signing
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/FutariKakeibo.xcarchive/Products/Applications/FutariKakeibo.app"
          INFO_PLIST="$APP_PATH/Info.plist"
          SIGNED_ENTITLEMENTS="$RUNNER_TEMP/signed-entitlements.plist"
          test -n "$(plutil -extract NSCameraUsageDescription raw -o - "$INFO_PLIST")"
          [[ "$(plutil -extract CKSharingSupported raw -o - "$INFO_PLIST")" == "true" ]]
          plutil -extract UILaunchScreen xml1 -o - "$INFO_PLIST" >/dev/null
          [[ "$(plutil -extract CFBundleVersion raw -o - "$INFO_PLIST")" == "2" ]]
          /usr/bin/codesign -d --entitlements :- "$APP_PATH" > "$SIGNED_ENTITLEMENTS" 2>/dev/null
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.developer.icloud-services:0' "$SIGNED_ENTITLEMENTS")" == "CloudKit" ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.developer.icloud-container-identifiers:0' "$SIGNED_ENTITLEMENTS")" == "iCloud.jp.aikawa.futarikakeibo" ]]

      - name: Export IPA
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>export</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>$TEAM_ID</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key>
              <string>$PROFILE_NAME</string>
            </dict>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>uploadSymbols</key>
            <true/>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/FutariKakeibo.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Upload to TestFlight
        shell: bash
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          API_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/private_keys"
          printf '%s' "$API_PRIVATE_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/private_keys/AuthKey_$API_KEY_ID.p8"
          chmod 600 "$RUNNER_TEMP/private_keys/AuthKey_$API_KEY_ID.p8"
          IPA_PATH="$(find "$RUNNER_TEMP/export" -maxdepth 1 -type f -name '*.ipa' -print -quit)"
          if [[ -z "$IPA_PATH" ]]; then
            echo "No IPA file was exported."
            exit 1
          fi
          cd "$RUNNER_TEMP"
          xcrun altool --upload-app --type ios --file "$IPA_PATH" --apiKey "$API_KEY_ID" --apiIssuer "$API_ISSUER_ID"

      - name: Clean up signing files
        if: always()
        shell: bash
        run: |
          set +e
          PROFILE_UUID="$(cat "$RUNNER_TEMP/profile_uuid" 2>/dev/null)"
          if [[ -n "$PROFILE_UUID" ]]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          fi
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" 2>/dev/null
          rm -f "$RUNNER_TEMP/distribution_certificate.p12"
          rm -f "$RUNNER_TEMP/FutariKakeibo_App_Store.mobileprovision"
          rm -f "$RUNNER_TEMP/private_keys/AuthKey_"*.p8

