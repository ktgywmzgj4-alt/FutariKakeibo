name: iOS build and tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        shell: bash
        run: |
          set -euo pipefail
          XCODE_PATH="$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' -print | sort -V | tail -n 1)"
          if [[ -z "$XCODE_PATH" ]]; then
            echo "Xcode 26 is not installed on this runner."
            exit 1
          fi
          sudo xcode-select --switch "$XCODE_PATH/Contents/Developer"
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version

      - name: Install XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
          xcodegen --version

      - name: Generate Xcode project
        shell: bash
        run: |
          set -euo pipefail
          xcodegen generate

      - name: Inspect project and available simulators
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -list -project FutariKakeibo.xcodeproj
          xcrun simctl list runtimes available
          xcrun simctl list devices available

      - name: Select an available iPhone Simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          SIMULATOR_UDID="$(
            xcrun simctl list devices available --json |
            ruby -rjson -e '
              devices = JSON.parse(STDIN.read).fetch("devices")
              runtime = devices.keys.grep(/iOS/).sort.reverse.find do |key|
                devices.fetch(key).any? { |device| device["isAvailable"] && device["name"].start_with?("iPhone") }
              end
              abort "No available iPhone Simulator was found." unless runtime
              device = devices.fetch(runtime).find { |item| item["isAvailable"] && item["name"].start_with?("iPhone") }
              puts device.fetch("udid")
            '
          )"
          echo "udid=$SIMULATOR_UDID" >> "$GITHUB_OUTPUT"

      - name: Build and run unit tests
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project FutariKakeibo.xcodeproj \
            -scheme FutariKakeibo \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath DerivedData \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            test

  testflight:
    # **TestFlight へ送るのは main からだけ。** 以前は起動したブランチをそのまま送っていて、
    # 機能ブランチからの送信が5回あった（2026-09。うち2回はマージされていない PR #29）。
    # 配信は Claude が起こすので、ブランチを取り違えても送れない形にしておく（2026-10-14 利用者が承認）。
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: macos-26
    timeout-minutes: 45
    outputs:
      # testflight-status が、どのビルドを待てばよいか知るため。
      build_number: ${{ steps.build_number.outputs.value }}
    env:
      TEAM_ID: 79XN3292J9
      BUNDLE_ID: jp.aikawa.futarikakeibo
      PROFILE_NAME: FutariKakeibo App Store

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        shell: bash
        run: |
          set -euo pipefail
          XCODE_PATH="$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' -print | sort -V | tail -n 1)"
          if [[ -z "$XCODE_PATH" ]]; then
            echo "Xcode 26 is not installed on this runner."
            exit 1
          fi
          sudo xcode-select --switch "$XCODE_PATH/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen and generate project
        shell: bash
        run: |
          set -euo pipefail
          HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
          xcodegen generate

      - name: Import Apple Distribution certificate
        shell: bash
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          CERTIFICATE_PATH="$RUNNER_TEMP/distribution_certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"

          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Install App Store provisioning profile
        shell: bash
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          PROFILE_PATH="$RUNNER_TEMP/FutariKakeibo_App_Store.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"
          PROFILE_DIRECTORY="$HOME/Library/MobileDevice/Provisioning Profiles"

          printf '%s' "$PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PROFILE_PLIST")"
          mkdir -p "$PROFILE_DIRECTORY"
          cp "$PROFILE_PATH" "$PROFILE_DIRECTORY/$PROFILE_UUID.mobileprovision"
          printf '%s' "$PROFILE_UUID" > "$RUNNER_TEMP/profile_uuid"

      - name: Choose a build number
        id: build_number
        shell: bash
        run: |
          set -euo pipefail
          # App Store Connectは同じバージョン内でビルド番号が増えることを求める。
          # 撮影時刻から作れば必ず前より大きくなり、各要素も5桁に収まる。
          # 各要素の先頭の0は落とす。Apple側は落として表示する（2026.1015.0405 → 2026.1015.405）ので、
          # 落としておけば TestFlight と設定画面の表示が同じになる。数として比べるので並び順は変わらない（T-032）。
          read -r YEAR MONTHDAY HOURMIN < <(date -u '+%Y %m%d %H%M')
          BUILD_NUMBER="${YEAR}.$((10#$MONTHDAY)).$((10#$HOURMIN))"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "value=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "build number: $BUILD_NUMBER"

      - name: Archive signed app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project FutariKakeibo.xcodeproj \
            -scheme FutariKakeibo \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/FutariKakeibo.xcarchive" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY='Apple Distribution' \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            OTHER_CODE_SIGN_FLAGS="--keychain $RUNNER_TEMP/app-signing.keychain-db"

      - name: Show the version inside the archive
        shell: bash
        run: |
          set -euo pipefail
          APP="$(find "$RUNNER_TEMP/FutariKakeibo.xcarchive/Products/Applications" -maxdepth 1 -name '*.app' -print -quit)"
          echo "archive app: $APP"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist"

      - name: Export IPA
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>export</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>$TEAM_ID</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key>
              <string>$PROFILE_NAME</string>
            </dict>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>uploadSymbols</key>
            <true/>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/FutariKakeibo.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Upload to TestFlight
        shell: bash
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          API_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/private_keys"
          printf '%s' "$API_PRIVATE_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/private_keys/AuthKey_$API_KEY_ID.p8"
          chmod 600 "$RUNNER_TEMP/private_keys/AuthKey_$API_KEY_ID.p8"
          IPA_PATH="$(find "$RUNNER_TEMP/export" -maxdepth 1 -type f -name '*.ipa' -print -quit)"
          if [[ -z "$IPA_PATH" ]]; then
            echo "No IPA file was exported."
            exit 1
          fi
          cd "$RUNNER_TEMP"
          xcrun altool --upload-app --type ios --file "$IPA_PATH" --apiKey "$API_KEY_ID" --apiIssuer "$API_ISSUER_ID"

      - name: Clean up signing files
        if: always()
        shell: bash
        run: |
          set +e
          PROFILE_UUID="$(cat "$RUNNER_TEMP/profile_uuid" 2>/dev/null)"
          if [[ -n "$PROFILE_UUID" ]]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          fi
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" 2>/dev/null
          rm -f "$RUNNER_TEMP/distribution_certificate.p12"
          rm -f "$RUNNER_TEMP/FutariKakeibo_App_Store.mobileprovision"
          rm -f "$RUNNER_TEMP/private_keys/AuthKey_"*.p8

  testflight-status:
    # 送ったあと、App Store Connect の処理が終わって**内部テスターに配られたか**を見る。
    # altool の UPLOAD SUCCEEDED は「Appleが受け取った」までしか言わない。
    # 処理は10〜30分かかり、そのあいだ利用者からは「配信されていない」と見えていた。
    #
    # **鍵はこのジョブの中でだけ使う。** Claude は鍵を見ず、この結果だけを読む。
    # ここが落ちても、送信（testflight）が成功したことは変わらない。
    needs: testflight
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      BUNDLE_ID: jp.aikawa.futarikakeibo

    steps:
      - uses: actions/checkout@v4

      - name: Wait until internal testers have the build
        shell: bash
        env:
          BUILD_NUMBER: ${{ needs.testflight.outputs.build_number }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          API_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          export ASC_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$API_PRIVATE_KEY_BASE64" | base64 --decode > "$ASC_KEY_PATH"
          chmod 600 "$ASC_KEY_PATH"
          ruby scripts/testflight_status.rb

      - name: Clean up the API key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"

  scripts:
    # 配信まわりのスクリプトの自己点検。本物の鍵も通信も使わない。
    # testflight-status は配信のときしか走らないので、壊れていたらPRの段階で分かるようにする。
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Self-test the TestFlight status script
        shell: bash
        run: |
          set -euo pipefail
          ruby --version
          ruby scripts/testflight_status.rb --self-test
