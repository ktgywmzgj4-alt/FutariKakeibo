name: FutariKakeibo
options:
  bundleIdPrefix: jp.aikawa
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "79XN3292J9"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  FutariKakeibo:
    type: application
    platform: iOS
    sources:
      - path: FutariKakeibo
    info:
      path: FutariKakeibo/Resources/Info.plist
      properties:
        CFBundleDisplayName: "ふたり家計簿"
        CKSharingSupported: true
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        NSCameraUsageDescription: "レシートを撮影し、店名や合計金額を端末内で読み取るためにカメラを使用します。"
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities:
          - arm64
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    entitlements:
      path: FutariKakeibo/Resources/FutariKakeibo.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.jp.aikawa.futarikakeibo
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.ubiquity-kvstore-identifier: "$(TeamIdentifierPrefix)jp.aikawa.futarikakeibo"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.aikawa.futarikakeibo
        PRODUCT_NAME: FutariKakeibo
        CURRENT_PROJECT_VERSION: "2"
        MARKETING_VERSION: "1.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: "ふたり家計簿"
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
  FutariKakeiboTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FutariKakeiboTests
    dependencies:
      - target: FutariKakeibo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.aikawa.futarikakeibo.tests
  FutariKakeiboUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: FutariKakeiboUITests
    dependencies:
      - target: FutariKakeibo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.aikawa.futarikakeibo.uitests
        TEST_TARGET_NAME: FutariKakeibo
schemes:
  FutariKakeibo:
    build:
      targets:
        FutariKakeibo: all
        FutariKakeiboTests: [test]
        FutariKakeiboUITests: [test]
    test:
      gatherCoverageData: true
      targets:
        - FutariKakeiboTests
        - FutariKakeiboUITests
