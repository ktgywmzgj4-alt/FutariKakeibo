name: FutariKakeibo
options:
  bundleIdPrefix: jp.aikawa
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.0"
    CURRENT_PROJECT_VERSION: "2"
    MARKETING_VERSION: "0.1.0"
    DEVELOPMENT_TEAM: "79XN3292J9"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  FutariKakeibo:
    type: application
    platform: iOS
    sources:
      - path: FutariKakeibo
    info:
      path: FutariKakeibo/Resources/Info.plist
    entitlements:
      path: FutariKakeibo/Resources/FutariKakeibo.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.aikawa.futarikakeibo
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: "ふたり家計簿"
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
  FutariKakeiboTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FutariKakeiboTests
    dependencies:
      - target: FutariKakeibo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.aikawa.futarikakeibo.tests
schemes:
  FutariKakeibo:
    build:
      targets:
        FutariKakeibo: all
        FutariKakeiboTests: [test]
    test:
      gatherCoverageData: true
      targets:
        - FutariKakeiboTests
